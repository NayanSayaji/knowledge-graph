name: Deploy Knowledge Portal

on:
  push:
    branches: ["__SYNC_BRANCH__"]
    paths:
      - "__KNOWLEDGE_DIRECTORY__/**"
      - "portal/**"
      - ".github/workflows/deploy-knowledge-portal.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Install portal dependencies
        working-directory: portal
        run: npm ci
      - name: Copy generated knowledge
        run: |
          mkdir -p portal/public
          cp -R "__KNOWLEDGE_DIRECTORY__" portal/public/knowledge
      - name: Build portal
        working-directory: portal
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: portal/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
